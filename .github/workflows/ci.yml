name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features ui-test -- -D warnings
      - name: Test
        run: cargo test --locked

  # Ubuntu 24.04 has no gtk4-layer-shell package; Fedora does.
  layer-shell:
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 and gtk4-layer-shell
        run: dnf install -y gcc cargo gtk4-devel gtk4-layer-shell-devel
      - name: Build with layer-shell
        run: cargo build --locked --features layer-shell
