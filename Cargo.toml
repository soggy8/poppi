[package]
name = "poppi_launcher"
version = "0.3.0"
edition = "2021"
description = "Fast application launcher for GNOME"
license = "MIT"
repository = "https://github.com/soggy8/poppi"

[dependencies]
# glib, gio and gdk are used through the gtk4 re-exports.
gtk = { version = "0.9", package = "gtk4", features = ["v4_12"] }
fuzzy-matcher = "0.3"
emojis = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
urlencoding = "2.1"
gtk4-layer-shell = { version = "0.5", optional = true }

[features]
# Scripted UI driver used by scripts/ui-smoke.sh; never enabled in releases.
ui-test = []
# Use the wlr layer-shell protocol (Sway, Hyprland, Niri, KDE) when the
# compositor offers it; needs the gtk4-layer-shell system library.
layer-shell = ["dep:gtk4-layer-shell"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
